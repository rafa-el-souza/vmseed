# Key bindings
bind r source-file ~/.tmux.conf \; display " Reloaded!"
bind y setw synchronize-panes
bind -r m resize-pane -Z
bind -r Up resize-pane -U 20
bind -r Down resize-pane -D 20
bind -r Left resize-pane -L 20
bind -r Right resize-pane -R 20
# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window
bind C-l last-window
# split panes using Alt + h/v. keep current dir
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-h split-window -v -c "#{pane_current_path}"
# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind x kill-pane
bind-key q confirm-before -p "Kill session #S? (y/n)" kill-session

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

#set-option -g status-keys vi
#set-window-option -g mode-keys vi
#bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Change the prefix key to C-Space
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Status
set -g status-interval 2
#set -g escape-time 40
#set -g repeat-time 350
#set -g display-time 150

# Increase scrollback history for verbose Claude outputs
set -g history-limit 50000

# UTF-8 support for formatted responses
setw -q -g utf8 on

# Activity Monitoring
setw -g monitor-activity on
set -g visual-activity on

# Options to make tmux more pleasant
set -g mouse on
#set -g default-terminal "tmux-256color"
#set-option -ga terminal-overrides ",xterm-256color:Tc"
set -sg terminal-overrides ",*:RGB"
set -g set-clipboard on
set -g detach-on-destroy off
set -g remain-on-exit on

#pane and window selection with the mouse
#set-option -g mouse-select-pane
#set -g mouse-select-window on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Auto renumber windows on close
set -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'

set -g @sidebar-tree-command 'tree -C'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'  # Save every 5 minutes

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_directory_bg_color "#{@thm_peach}"
set -g @catppuccin_directory_color "#{@thm_peach}"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line more pleasant.
#set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -gF  status-right "#{@catppuccin_status_directory}"
##set -g status-right "#{E:@catppuccin_status_application}"
##set -agF status-right "#{E:@catppuccin_status_cpu}"
##set -agF status-right "#{E:@catppuccin_status_load}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{@catppuccin_status_host}"
set -agF status-right "#{@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
#set -agF status-right "#{@catppuccin_status_gitmux}"
##set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run ~/.tmux/plugins/tpm/tpm