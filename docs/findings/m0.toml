summary = "`_patterns_added` splits git's diff output with `str.splitlines()`. That also breaks a git line at form feed, vertical tab, a lone CR, \\x1c to \\x1e, NEL, U+2028 and U+2029, so `trigger` misses a pattern that follows one of those characters on an added line."
scenario = "A milestone adds this line to src/vmseed/cli.py, which is not a trigger path: `SEPARATOR = \"<raw form feed>\"; import subprocess`. git counts it as one added line that contains `subprocess`. `findings.py trigger BASE..HEAD` still returns no match and prints `not triggered`. The review session then records `security = \"not triggered\"` and does not launch the security reviewer. The same line without the separator is matched."
evidence = "test"
reproduction = "tests/contract/test_findings_trigger.py::test_a_pattern_on_an_added_line_that_holds_a_unicode_line_break_matches"
path = "ordinary"
effect = "misreport"
clause = "decided"
rule = "11, When the security reviewer runs: a line added to any other file under src/ that contains one of the listed patterns sets off the security reviewer"
plan = "fix"
outcome = ""
unlikely = "It needs one of these raw characters before the pattern on an added source line: form feed, vertical tab, lone CR, \\x1c to \\x1e, NEL, U+2028 or U+2029. Python sources rarely hold one except as a page-break line of its own."
note = "The security reviewer reports the same defect as S2 (M0-F13); one fix commit cites both."

