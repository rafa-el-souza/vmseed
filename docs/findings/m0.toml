clause = ""
rule = ""
plan = "fix"
outcome = ""
unlikely = "It needs a clone that held v0's private files when it moved to v2 (in this development clone no local exclude rule covers those names either), then an `add --all` and a push by someone who does not read the untracked list in `git status`."
note = "The correctness reviewer names the same point in a note, not as a claim."

