round = 1
source = "fix-review"
ref = "R2"
file = "tests/unit/test_layers.py"
line = 61
summary = "DYNAMIC_IMPORTS still leaves out standard-library calls that import the package or module a string names: `importlib.resources.files`, `pkgutil.get_data` and `pydoc.locate`. This is the mistake of M0-F02, M0-F20 and M0-F21, so the import-rule test passes while a restricted layer imports a forbidden one through these calls."
scenario = "src/vmseed/guest/registry.py calls `importlib.resources.files('vmseed.host')`. Three other spellings behave the same: `files('vmseed.host')` after `from importlib.resources import files`, `pkgutil.get_data('vmseed.host', 'data.txt')`, and `pydoc.locate('vmseed.host.virsh')`. Each imports vmseed.host, and `violations()` returns an empty list. The commit body names this mistake ('runpy.run_module and importlib.util.find_spec also import by name and are not counted'), but the sibling search stopped at those two names. The rest of the importlib.resources API (read_text, open_binary and the others) takes the same path; not run."
evidence = "test"
reproduction = "tests/unit/test_layers.py::test_a_lookup_that_imports_the_package_it_names_is_found"
path = "ordinary"
effect = "none"
clause = "decided"
rule = "01 Import rule (\"A test enforces this\"); M0 scope: the test that enforces the import rule between layers"
plan = "fix"
outcome = "fixed"
about = "M0-F02"
unlikely = "It needs a restricted layer to read a resource of, or locate an object in, a forbidden layer's package by name; vmseed's data is meant for vmseed.data, which no rule forbids."

[[finding]]
id = "M0-F24"
round = 1
source = "fix-review"
ref = "R3"
file = "tests/unit/test_layers.py"
line = 125
summary = "The test now refuses, as 'a module named at run time', a relative dynamic import whose name is a literal and whose package is given as `__package__`. Its target is known and in the same layer, and before the fix the import-rule test passed it."
scenario = "src/vmseed/guest/registry.py runs `importlib.import_module('.controls', __package__)`, and src/vmseed/guest/controls.py exists: guest imports guest, which the rule allows. `_dynamic_target` takes the package only from a string literal (lines 125-128) and returns None for `__package__` (lines 129-130). `imports_of` then adds UNKNOWN (line 162), and `violations()` reports 'vmseed.guest.registry imports <a module named at run time>'. So `test_the_package_follows_the_import_rule`, part of the `uv run pytest` gate of CLAUDE.md, fails on code that follows the rule. The module docstring says only a name that is not a literal is refused. The same test passes with the checker before the fix. `importlib.util.find_spec('.x', __package__)`, counted since the fix of M0-F21, goes through the same lines."
evidence = "test"
reproduction = "tests/unit/test_layers.py::test_a_literal_relative_import_within_the_layer_passes"
path = "ordinary"
effect = "blocked"
clause = ""
rule = ""
plan = "fix"
outcome = "fixed"
about = "M0-F02"
unlikely = "A literal relative name given to import_module is rare: the same import is usually a static relative import, and import_module serves computed names, which the test refuses by design."

